<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 交易 Agent 系统</title>
<script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
<style>
:root{--primary:#667eea;--bg:#f5f7fa;--card:#fff;--text:#333;--muted:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;font-weight:600}
.header .sub{font-size:13px;opacity:.85}
.nav{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:0 28px;display:flex;gap:4px;position:sticky;top:0;z-index:10}
.nav button{border:none;background:none;padding:14px 20px;font-size:14px;cursor:pointer;color:#666;border-bottom:3px solid transparent;font-weight:500}
.nav button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.nav button:hover{color:var(--primary)}
.container{max-width:1280px;margin:24px auto;padding:0 20px}
.tab{display:none}
.tab.active{display:block}
.panel{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:24px}
.panel h2{font-size:17px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #e5e7eb;color:#1e293b}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f0f1f3}
th{background:#f8f9fc;font-weight:600;color:#555}
tr:hover{background:#fafbfe}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge.running{background:#dcfce7;color:#166534}
.badge.paused{background:#fef9c3;color:#854d0e}
.badge.archived{background:#e2e8f0;color:#475569}
.badge.positive{background:#dcfce7;color:#166534}
.badge.negative{background:#fee2e2;color:#991b1b}
.badge.flat{background:#f1f5f9;color:#64748b}
.badge.overseer{background:#ede9fe;color:#6d28d9}
.btn{background:var(--primary);color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#eef0f7;color:#555}
.btn.green{background:#16a34a}
.btn.red{background:#dc2626}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.gray{background:#64748b}
.muted{color:var(--muted);font-size:12px}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:24px}
.agent-card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent;transition:all .15s}
.agent-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.agent-card.selected{border-color:var(--primary)}
.agent-card h3{font-size:16px;color:#1e293b;display:flex;justify-content:space-between;align-items:center}
.agent-card .desc{font-size:13px;color:var(--muted);margin:8px 0;min-height:36px}
.agent-card .meta{font-size:12px;color:#555;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.agent-card .actions{display:flex;gap:8px;flex-wrap:wrap}
.ret-big{font-size:22px;font-weight:700}
.layout{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:#555;margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit}
.form-row textarea{resize:vertical;min-height:60px}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--primary)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:560px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-box h2{margin-bottom:18px;color:#1e293b}
.cfg-model-row{display:flex;gap:8px;align-items:flex-start}
.cfg-model-row select{flex:1}
.cfg-refresh{flex-shrink:0;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#f8fafc;color:#475569;font-size:12px;cursor:pointer;white-space:nowrap}
.cfg-refresh:disabled{opacity:.6;cursor:wait}
.cfg-refresh-note{font-size:11px;color:var(--muted);margin-top:5px;min-height:14px}
.chat-box{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px;height:560px;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#f1f5f9;color:#1e293b;border-bottom-left-radius:4px}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.chat-input{display:flex;gap:10px;margin-top:12px}
.chat-input input{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.chat-input input:focus{outline:none;border-color:var(--primary)}
.tool-block{margin:4px 0;padding:8px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;align-self:flex-start;width:calc(80% - 8px)}
.tool-block .tool-name{color:var(--primary);font-weight:600}
.tool-block .tool-args{color:#475569;font-family:ui-monospace,monospace;font-size:12px;margin-top:4px;white-space:pre-wrap;word-break:break-all}
.tool-block .tool-result{color:#166534;font-size:12px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.typing::after{content:'▍';animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.cfg-group{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px}
.cfg-group h3{font-size:15px;margin-bottom:14px;color:#1e293b;padding-bottom:8px;border-bottom:1px solid #eee}
.cfg-item{margin-bottom:12px}
.cfg-item label{display:block;font-size:13px;color:#555;margin-bottom:5px}
.cfg-item label .desc{color:var(--muted);font-weight:400}
.cfg-item input,.cfg-item select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.cfg-item input:focus,.cfg-item select:focus{outline:none;border-color:var(--primary)}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.config-grid{grid-template-columns:1fr}}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#f8f9fc;border-radius:10px;padding:14px}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:700;color:#1e293b;margin-top:4px}
.chart{height:300px}
.tip{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:6px;font-size:13px;color:#7c4a03;margin-bottom:16px}
.empty{color:var(--muted);text-align:center;padding:30px}

/* ---- Coze 风格技能面板 ---- */
.skill-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.skill-panel-head input{flex:1;max-width:320px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.skill-panel-head input:focus{outline:none;border-color:var(--primary)}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.skill-card{display:flex;gap:12px;align-items:flex-start;background:#f8f9fc;border:1px solid #eef0f4;border-radius:10px;padding:14px;transition:box-shadow .15s}
.skill-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.skill-icon{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#eef0f7,#dfe3f5);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.skill-icon img{width:100%;height:100%;object-fit:cover}
.skill-body{flex:1;min-width:0}
.skill-body .t{font-size:14px;font-weight:600;color:#1e293b;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.skill-body .d{font-size:12px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.skill-body .m{font-size:11px;color:#64748b;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.skill-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.skill-actions .btn{white-space:nowrap}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;background:#eef2ff;color:#4f46e5}
.tag.key{background:#fef3c7;color:#92400e}
.tag.installed{background:#dcfce7;color:#166534}
/* 技能市场弹窗 */
.market-box{max-width:860px}
.market-head{display:flex;gap:10px;margin-bottom:16px}
.market-head input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px}
.market-head input:focus{outline:none;border-color:var(--primary)}
.market-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.market-cats button{border:1px solid #e2e8f0;background:#fff;padding:5px 14px;border-radius:20px;font-size:12px;color:#475569;cursor:pointer}
.market-cats button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.market-list{max-height:56vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-right:4px}
@media(max-width:720px){.market-list{grid-template-columns:1fr}}
.market-item{display:flex;gap:12px;align-items:center;border:1px solid #eef0f4;border-radius:10px;padding:12px;background:#fff}
.market-item .skill-body .d{-webkit-line-clamp:2}
.market-item .add-btn{flex-shrink:0}
</style>
</head>
<body>
<div class="header">
  <h1>AI 交易 Agent 系统</h1>
  <div class="sub" id="sysInfo">加载中…</div>
</div>
<div class="nav">
  <button class="active" data-tab="agents" onclick="switchTab('agents')">交易 Agent</button>
  <button data-tab="chat" onclick="switchTab('chat')">对话</button>
  <button data-tab="ranking" onclick="switchTab('ranking')">收益排名</button>
  <button data-tab="config" onclick="switchTab('config')">系统配置</button>
</div>
<div class="container">

  <!-- ============ Agent 管理 ============ -->
  <div class="tab active" id="tab-agents">
    <div class="layout">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 style="color:#1e293b">我的交易 Agent</h2>
          <button class="btn" onclick="openAgentModal()">+ 新建 Agent</button>
        </div>
        <div id="agentList" class="agent-grid"></div>
      </div>
      <div id="agentDetail" class="panel"><div class="empty">选择一个 Agent 查看详情</div></div>
    </div>
  </div>

  <!-- ============ 对话 ============ -->
  <div class="tab" id="tab-chat">
    <div class="panel">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <label style="font-size:14px;color:#555">对话对象：</label>
        <select id="chatAgentSel" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;min-width:220px" onchange="loadChat()"></select>
        <button class="btn ghost sm" onclick="loadChat()">刷新</button>
      </div>
    </div>
    <div class="chat-box">
      <div class="chat-msgs" id="chatMsgs"><div class="empty">选择 Agent 开始对话</div></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="例如：用低市盈率+高动量帮我选 5 只股票，并买入……" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" id="chatSendBtn" onclick="sendChat()">发送</button>
      </div>
    </div>
  </div>

  <!-- ============ 收益排名 ============ -->
  <div class="tab" id="tab-ranking">
    <div class="panel">
      <h2>Agent 收益排名</h2>
      <table id="rankTable">
        <thead><tr><th>排名</th><th>Agent</th><th>状态</th><th>累计收益</th><th>总资产</th><th>持仓</th><th>最新净值日</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="panel">
      <h2>收益对比</h2>
      <div class="chart" id="rankChart"></div>
    </div>
  </div>

  <!-- ============ 系统配置 ============ -->
  <div class="tab" id="tab-config">
    <div class="tip">大模型配置保存后立即生效；每个 Agent 也可在「交易 Agent → 编辑」中单独设置自己的大模型版本。</div>
    <div class="config-grid" id="configGroups"></div>
    <div style="display:flex;gap:12px;align-items:center">
      <button class="btn green" id="btnSaveConfig" onclick="saveConfig()">保存配置</button>
      <span id="configSaveInfo" class="muted"></span>
    </div>
  </div>
</div>

<!-- ============ 新建/编辑 Agent 弹窗 ============ -->
<div class="modal" id="agentModal">
  <div class="modal-box">
    <h2 id="agentModalTitle">新建 Agent</h2>
    <div class="form-row"><label>名称 *</label><input id="f_name" placeholder="如：价值投资 Agent"></div>
    <div class="form-row"><label>定位描述</label><textarea id="f_description" placeholder="如：专注于低估值蓝筹股的价值投资"></textarea></div>
    <div class="form-row" id="row_system_prompt" style="display:none"><label>系统提示词（可选，自定义行为；留空则使用系统配置的默认提示词）</label><textarea id="f_system_prompt" placeholder="留空则使用系统配置的默认提示词"></textarea></div>
    <div class="form-row"><label>大模型服务商</label>
      <select id="f_provider" onchange="providerChanged()">
        ${PROVIDERS.map(p=>`<option value="${p}">${PROVIDER_LABELS[p]||p}</option>`).join('')}
      </select>
    </div>
    <div class="form-row"><label>API Key（留空则使用系统默认配置）</label><input id="f_api_key" type="password" placeholder="sk-..."></div>
    <div class="form-row"><label>Base URL（可选，默认使用服务商官方地址）</label><input id="f_base_url" placeholder="https://..."></div>
    <div class="form-row"><label>模型版本</label>
      <div class="cfg-model-row">
        <select id="f_model"></select>
        <button type="button" class="cfg-refresh" onclick="fetchModels()">服务器模型</button>
      </div>
      <input id="f_model_custom" style="display:none;margin-top:6px" placeholder="输入自定义模型名">
      <div class="cfg-refresh-note" id="f_model_note"></div>
    </div>
    <div class="form-row"><label>初始资金（元）</label><input id="f_capital" type="number" value="100000"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn ghost" onclick="closeAgentModal()">取消</button>
      <button class="btn green" onclick="saveAgent()">保存</button>
    </div>
  </div>
</div>

<!-- ============ 定时任务弹窗 ============ -->
<div class="modal" id="taskModal">
  <div class="modal-box">
    <h2>添加定时自动任务</h2>
    <div class="form-row"><label>类型</label>
      <select id="t_type" onchange="document.getElementById('t_time_row').style.display=this.value==='daily'?'':'none';document.getElementById('t_interval_row').style.display=this.value==='interval'?'':'none'">
        <option value="daily">每日（交易日 指定时间）</option>
        <option value="interval">间隔（每 N 小时）</option>
      </select>
    </div>
    <div class="form-row" id="t_time_row"><label>触发时间（HH:MM）</label><input id="t_time" type="time" value="09:30"></div>
    <div class="form-row" id="t_interval_row" style="display:none"><label>间隔小时</label><input id="t_interval" type="number" value="4" min="0.5" step="0.5"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px">
      <button class="btn ghost" onclick="closeTaskModal()">取消</button>
      <button class="btn green" onclick="saveTask()">添加</button>
    </div>
  </div>
</div>

<!-- ============ 技能市场弹窗 ============ -->
<div class="modal" id="skillMarketModal">
  <div class="modal-box market-box">
    <h2>技能市场</h2>
    <div class="market-head">
      <input id="sm_search" placeholder="搜索技能，如：PDF、数据分析、周报…" onkeydown="if(event.key==='Enter')loadSkillMarket()">
      <button class="btn green" onclick="loadSkillMarket()">搜索</button>
    </div>
    <div class="market-cats" id="sm_cats"></div>
    <div id="sm_status" class="muted" style="margin-bottom:10px"></div>
    <div class="market-list" id="sm_list"></div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
      <button class="btn ghost" onclick="closeSkillMarket()">关闭</button>
    </div>
  </div>
</div>

<script>
const PROVIDERS = ['deepseek','qwen','moonshot','glm','doubao','baidu','spark','ollama'];
const PROVIDER_LABELS = {deepseek:'DeepSeek',qwen:'通义千问',moonshot:'Kimi',glm:'智谱GLM',doubao:'豆包(火山方舟)',baidu:'百度千帆',spark:'讯飞星火',ollama:'本地Ollama'};
const MODEL_PRESETS = {
  deepseek:['deepseek-v4-pro','deepseek-v4-flash'],
  qwen:['qwen3.8-max','qwen3.7-max','qwen3.7-plus','qwen3.7-flash','qwen3.6-plus','qwen3.6-flash','qwen-plus','qwen-flash','qwen-long','qwen3-coder-plus','qwen3-coder-flash'],
  moonshot:['kimi-k3','kimi-k2.7-code','kimi-k2.7-code-highspeed','kimi-k2.6'],
  glm:['glm-5.3','glm-5.2','glm-5.1','glm-5','glm-5-turbo','glm-4.7','glm-4.6','glm-4.5','glm-4-flash'],
  doubao:['doubao-seed-evolving','doubao-seed-2.1-pro','doubao-seed-2.1-turbo','doubao-seed-2.0-pro','doubao-seed-2.0-lite','doubao-seed-2.0-mini'],
  baidu:['ernie-5.0','ernie-4.5-turbo-128k','ernie-4.5-turbo-32k','ernie-4.5-21b-a3b','ernie-x1-turbo-32k'],
  spark:['4.0Ultra','pro-128k','max-32k','generalv3'],
  ollama:['qwen3:8b','qwen3:30b-a3b','qwen2.5:7b','qwen2.5:14b','llama3.3:70b','llama3.1:8b','deepseek-r1:7b','glm4:9b'],
};
let agents = [];
let selectedAgentId = null;
let configData = null;

function switchTab(name){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  if(name==='agents'){ loadAgents(); }
  if(name==='chat'){ loadChatSelect(); loadChat(); }
  if(name==='ranking'){ loadRanking(); }
  if(name==='config'){ loadConfig(); }
}

async function api(path, opts={}){
  const r = await fetch(path, opts);
  if(!r.ok){ let d=null; try{d=await r.json()}catch(e){} throw new Error((d&&d.detail)||r.status); }
  return r.json();
}
function pct(v){ return v===null||v===undefined ? '—' : (v*100).toFixed(2)+'%'; }
function money(v){ return v===null||v===undefined ? '—' : Number(v).toLocaleString('zh-CN',{maximumFractionDigits:0}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============ Agent 列表与详情 ============
async function loadAgents(){
  try{ agents = await api('/api/agents'); }catch(e){ agents=[]; }
  const el = document.getElementById('agentList');
  if(!agents.length){ el.innerHTML='<div class="empty">还没有 Agent，点击「+ 新建 Agent」创建第一个</div>'; return; }
  el.innerHTML = agents.map(a=>{
    const ret = a.cumulative_return;
    const retHtml = ret===null||ret===undefined
      ? '<span class="muted">暂无绩效</span>'
      : `<span class="ret-big ${ret>=0?'badge positive':'badge negative'}">${pct(ret)}</span>`;
    const badgeCls = a.status==='running'?'running':a.status==='paused'?'paused':'archived';
    return `<div class="agent-card ${a.id===selectedAgentId?'selected':''}" onclick="selectAgent('${a.id}')">
      <h3>${esc(a.name)} ${a.is_overseer?'<span class="badge overseer">统筹</span>':''} <span class="badge ${badgeCls}">${a.status}</span></h3>
      <div class="desc">${esc(a.description||'（无描述）')}</div>
      <div class="meta">

function providerChanged(){
  const p = document.getElementById('f_provider').value;
  const sel = document.getElementById('f_model');
  sel.innerHTML = (MODEL_PRESETS[p]||[]).map(m=>`<option value="${m}">${m}</option>`).join('') + '<option value="__custom__">自定义…</option>';
  modelSelectChanged();
}
function modelSelectChanged(){
  const sel = document.getElementById('f_model');
  const input = document.getElementById('f_model_custom');
  const custom = sel.value==='__custom__';
  input.style.display = custom?'':'none';
}
async function fetchModels(){
  const provider = document.getElementById('f_provider').value;
  const note = document.getElementById('f_model_note');
  const btn = event.target; btn.disabled=true; btn.textContent='加载中…'; note.textContent='';
  try{
    const r = await fetch('/api/llm/remote-models?provider='+provider);
    const d = await r.json();
    if(d.error){ note.textContent='获取失败：'+d.error; }
    else{
      const all=[...new Set([...(d.models||[]),...(d.preset||[])])];
      if(!all.length){ note.textContent='服务器未返回模型'; }
      else{
        const sel=document.getElementById('f_model');
        sel.innerHTML=all.map(m=>`<option value="${m}">${m}</option>`).join('')+'<option value="__custom__">自定义…</option>';
        note.textContent=(d.models||[]).length?`已从服务器获取 ${d.models.length} 个模型`:'已合并预设列表';
      }
    }
  }catch(e){ note.textContent='请求失败：'+e.message; }
  btn.disabled=false; btn.textContent='服务器模型';
}
let editingAgentId = null;
function openAgentModal(id=null){
  editingAgentId = id;
  document.getElementById('agentModalTitle').textContent = id?'编辑 Agent':'新建 Agent';
  document.getElementById('row_system_prompt').style.display = id?'':'none';
  const f=['f_name','f_description','f_system_prompt','f_provider','f_api_key','f_base_url','f_model','f_model_custom','f_capital'];
  f.forEach(x=>{const el=document.getElementById(x); if(x==='f_api_key'){el.value='';} });
  document.getElementById('f_model_note').textContent='';
  providerChanged();
  if(id){
    const a = agents.find(x=>x.id===id);
    if(a){
      document.getElementById('f_name').value=a.name;
      document.getElementById('f_description').value=a.description||'';
      document.getElementById('f_system_prompt').value=a.system_prompt||'';
      document.getElementById('f_provider').value=a.llm_provider||'deepseek';
      document.getElementById('f_base_url').value=a.llm_base_url||'';
      document.getElementById('f_capital').value=a.initial_capital;
      providerChanged();
      const sel=document.getElementById('f_model');
      const preset=(MODEL_PRESETS[a.llm_provider]||[]);
      if(a.llm_model && preset.includes(a.llm_model)){ sel.value=a.llm_model; }
      else{
        sel.value='__custom__';
        document.getElementById('f_model_custom').value=a.llm_model||'';
        modelSelectChanged();
      }
      document.getElementById('f_api_key').placeholder='留空保持不变（当前已配置）';
    }
  }
  document.getElementById('agentModal').classList.add('open');
}
function closeAgentModal(){ document.getElementById('agentModal').classList.remove('open'); }
async function saveAgent(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('请填写名称'); return; }
  let model = document.getElementById('f_model').value;
  if(model==='__custom__') model = document.getElementById('f_model_custom').value.trim();
  const payload = {
    name,
    description: document.getElementById('f_description').value.trim(),
    system_prompt: document.getElementById('f_system_prompt').value.trim(),
    llm_provider: document.getElementById('f_provider').value,
    llm_base_url: document.getElementById('f_base_url').value.trim(),
    llm_model: model,
    initial_capital: parseFloat(document.getElementById('f_capital').value)||100000,
  };
  const key = document.getElementById('f_api_key').value.trim();
  if(key) payload.llm_api_key = key;
  try{
    if(editingAgentId){ await api('/api/agents/'+editingAgentId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
    else{ await api('/api/agents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
    closeAgentModal(); loadAgents(); loadChatSelect();
    document.getElementById('sysInfo').textContent='Agent 已保存';
  }catch(e){ alert('保存失败：'+e.message); }
}

async function loadChatSelect(){

  sel.innerHTML=agents.map(a=>`<option value="${a.id}">${esc(a.name)}${a.is_overseer?'【统筹】':''}${a.status!=='running'?'（'+(a.status==='paused'?'暂停':'已归档')+'）':''}</option>`).join('');
  if(cur && agents.some(a=>a.id===cur)) sel.value=cur;

function addMsgEl(role, text){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=`<div class="meta">${role==='user'?'你':'Agent'}</div>`;
  const body=document.createElement('div');
  body.style.whiteSpace='pre-wrap';
  body.textContent=text;
  d.appendChild(body);
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return body;
}
function addToolEl(name,args,result){
  const box=document.getElementById('chatMsgs');
  const d=document.createElement('div');
  d.className='tool-block';
  d.innerHTML=`<span class="tool-name">🔧 ${esc(name)}</span>
    <div class="tool-args">${esc(JSON.stringify(args))}</div>
    <div class="tool-result">${esc(result||'执行中…')}</div>`;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}
async function loadChat(){
  const id=document.getElementById('chatAgentSel').value;
  const box=document.getElementById('chatMsgs');
  if(!id){ box.innerHTML='<div class="empty">选择 Agent 开始对话</div>'; return; }
  box.innerHTML='';
  try{
    const history=await api('/api/agents/'+id+'/chat');
    history.forEach(h=>addMsgEl(h.role==='user'?'user':'assistant', h.content||''));
    if(!history.length) box.innerHTML='<div class="empty">还没有对话，给 Agent 下达第一条指令吧</div>';
  }catch(e){ box.innerHTML='<div class="empty">加载失败</div>'; }
}
async function sendChat(){
  const id=document.getElementById('chatAgentSel').value;
  const input=document.getElementById('chatInput');
  const btn=document.getElementById('chatSendBtn');
  const text=input.value.trim();
  if(!id){ alert('请先选择 Agent'); return; }
  if(!text){ return; }
  input.value=''; btn.disabled=true;
  addMsgEl('user', text);
  const typing=addMsgEl('assistant','');
  typing.classList.add('typing');
  try{
    const res=await fetch('/api/agents/'+id+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=decoder.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const raw=buf.slice(0,idx); buf=buf.slice(idx+2);
        handleSSE(raw, typing);
      }
    }
  }catch(e){
    typing.classList.remove('typing');
    typing.textContent='（对话失败：'+e.message+'）';
  }
  typing.classList.remove('typing');
  btn.disabled=false;
  loadAgents(); loadRanking();
}
function handleSSE(raw, typing){
  const lines=raw.split('\n');
  const type=lines.find(l=>l.startsWith('event: '))?.slice(7).trim();
  const dataLine=lines.find(l=>l.startsWith('data: '));
  let data={}; try{ if(dataLine) data=JSON.parse(dataLine.slice(6)); }catch(e){}
  if(type==='token' && data.text){
    typing.textContent=(typing.textContent||'')+data.text;
    typing.closest('.chat-msgs').scrollTop=1e9;
  }else if(type==='tool'){
    addToolEl(data.name, data.args||{}, '');
  }else if(type==='tool_result'){
    const blocks=document.querySelectorAll('.tool-block');
    const last=blocks[blocks.length-1];
    if(last) last.querySelector('.tool-result').textContent=data.result||'';
  }else if(type==='done'){
    typing.textContent=data.text||'';
  }else if(type==='error'){
    typing.textContent='（'+data.error+'）';
  }
}

// ============ 收益排名 ============
async function loadRanking(){
  let ranks=[];
  try{ ranks=await api('/api/agents/ranking'); }catch(e){}
  const tb=document.querySelector('#rankTable tbody');
  tb.innerHTML=ranks.map((r,i)=>{
    const ret=r.cumulative_return;
    return `<tr>
      <td>${i+1}</td>
      <td><strong>${esc(r.name)}</strong></td>
      <td><span class="badge ${r.status==='running'?'running':'paused'}">${r.status}</span></td>
      <td>${ret===null||ret===undefined?'<span class="muted">—</span>':`<span class="badge ${ret>=0?'positive':'negative'}">${pct(ret)}</span>`}</td>
      <td>${money(r.total_value)}</td>
      <td>${r.positions_count||0}</td>
      <td class="muted">${r.trade_date?esc(r.trade_date):'—'}</td></tr>`;
  }).join('')||'<tr><td colspan="7"><div class="empty">暂无数据</div></td></tr>';
  // 净值对比图
  const withData=ranks.filter(r=>r.cumulative_return!==null&&r.cumulative_return!==undefined).slice(0,8);
  if(withData.length){
    const traces=await Promise.all(withData.map(async r=>{
      const perf=await api('/api/agents/'+r.agent_id+'/performance').catch(()=>[]);
      const start=perf[0]?.nav||100000;
      return {x:(perf||[]).map(p=>p.trade_date), y:(perf||[]).map(p=>((p.nav/start-1)*100)), name:r.name, type:'scatter', mode:'lines'};
    }));
    Plotly.newPlot('rankChart', traces, {margin:{l:50,r:20,t:20,b:40},yaxis:{title:'累计收益 %'},legend:{orientation:'h'}},{displayModeBar:false});
  }else{
    document.getElementById('rankChart').innerHTML='<div class="empty">暂无收益数据</div>';
  }
}

// ============ 系统配置 ============
let cfgProvider = 'deepseek';
const CFG_PROV_FIELDS = {api_key:'API Key', base_url:'Base URL', model:'模型版本'};

function renderCfgItem(item){
  let control='';
  if(item.options&&item.options.length){
    const provider=item.key.split('.')[1].replace('_model','');
    const known=item.options.includes(item.value);
    control=`<div class="cfg-model-row"><select id="cfg_${item.key}">${item.options.map(o=>`<option value="${o}" ${item.value===o?'selected':''}>${o}</option>`).join('')}<option value="__custom__" ${known?'':'selected'}>自定义…</option></select></div>
      <input id="cfg_custom_${item.key}" type="text" style="display:${known?'none':''};margin-top:6px" placeholder="自定义模型名" value="${known?'':esc(item.value)}">`;
  }else if(item.key==='agent.default_system_prompt'){
    control=`<textarea id="cfg_${item.key}" style="min-height:160px;font-family:inherit">${esc(item.value)}</textarea>
      <div class="cfg-refresh-note">Agent 未单独配置时使用；留空则用系统内置默认。</div>`;
  }else{
    control=`<input id="cfg_${item.key}" type="text" value="${esc(item.value)}" placeholder="${esc(item.default||'')}">`;
  }
  const tag=item.secret?'（敏感，留空保持原值）':'';
  return `<div class="cfg-item"><label>${item.key} <span class="desc">- ${item.description}${tag}</span></label>${control}</div>`;
}

async function loadConfig(){
  try{ configData=await api('/api/config'); }catch(e){ return; }
  const groups={};
  configData.schema.forEach(item=>{ (groups[item.category]=groups[item.category]||[]).push(item); });
  const CAT=configData.category_names||{};
  let html='';
  Object.keys(groups).forEach(cat=>{
    html+=`<div class="cfg-group"><h3>${CAT[cat]||cat}</h3>`;
    if(cat==='llm'){
      html+=renderLlmGroup(groups[cat]);
    }else{
      groups[cat].forEach(item=>{ html+=renderCfgItem(item); });
    }
    html+='</div>';
  });
  document.getElementById('configGroups').innerHTML=html;
  const defItem=(configData.schema||[]).find(i=>i.key==='llm.default_provider');
  if(defItem&&PROVIDERS.includes(defItem.value)) cfgProvider=defItem.value;
  switchCfgProvider(cfgProvider);
}

function renderLlmGroup(items){
  const byProv={};
  const extra=[];
  let html='';
  // 默认大模型服务商下拉
  const defItem=items.find(i=>i.key==='llm.default_provider');
  html+=`<div class="cfg-item"><label>默认大模型服务商 <span class="desc">- 系统调用大模型时默认使用的服务商</span></label>
    <select id="cfg_llm.default_provider">${PROVIDERS.map(p=>`<option value="${p}" ${(defItem?.value||'deepseek')===p?'selected':''}>${PROVIDER_LABELS[p]||p}</option>`).join('')}</select></div>`;
  // 服务商切换下拉
  html+=`<div class="cfg-item"><label>大模型服务商 <span class="desc">- 选择要配置的服务商，下方仅显示该服务商的配置</span></label>
    <select id="cfg_provider_selector" onchange="switchCfgProvider(this.value)">${PROVIDERS.map(p=>`<option value="${p}">${PROVIDER_LABELS[p]||p}</option>`).join('')}</select></div>`;
  // 每个服务商各自的 api_key/base_url/model（按 key 前缀分组）
  items.forEach(item=>{
    const m=(item.key||'').match(/^llm\.(\w+)_(api_key|base_url|model)$/);
    if(m&&PROVIDERS.includes(m[1])) (byProv[m[1]]=byProv[m[1]]||[]).push({...item, field:m[2]});
    else if(item.key!=='llm.default_provider') extra.push(item);
  });
  PROVIDERS.forEach(p=>{
    const list=byProv[p]||[];
    html+=`<div id="cfg_prov_${p}" style="display:none">`;
    ['api_key','base_url','model'].forEach(field=>{
      const item=list.find(i=>i.field===field);
      if(!item) return;
      const label=`${PROVIDER_LABELS[p]||p} ${CFG_PROV_FIELDS[field]}`;
      const tag=item.secret?'（敏感，留空保持原值）':'';
      if(field==='model'){
        const known=item.options.includes(item.value);
        html+=`<div class="cfg-item"><label>${label} <span class="desc">- ${item.description}${tag}</span></label>
          <div class="cfg-model-row"><select id="cfg_${item.key}">${item.options.map(o=>`<option value="${o}" ${item.value===o?'selected':''}>${o}</option>`).join('')}<option value="__custom__" ${known?'':'selected'}>自定义…</option></select></div>
          <input id="cfg_custom_${item.key}" type="text" style="display:${known?'none':''};margin-top:6px" placeholder="自定义模型名" value="${known?'':esc(item.value)}"></div>`;
      }else{
        html+=`<div class="cfg-item"><label>${label} <span class="desc">- ${item.description}${tag}</span></label>
          <input id="cfg_${item.key}" type="${field==='api_key'?'password':'text'}" value="${esc(item.value)}" placeholder="${esc(item.default||'')}"></div>`;
      }
    });
    html+='</div>';
  });
  extra.forEach(item=>{ html+=renderCfgItem(item); });
  return html;
}

function switchCfgProvider(p){
  cfgProvider=p;
  document.getElementById('cfg_provider_selector').value=p;
  PROVIDERS.forEach(x=>{
    const el=document.getElementById('cfg_prov_'+x);
    if(el) el.style.display=(x===p)?'':'none';
  });
}

async function saveConfig(){
  const btn=document.getElementById('btnSaveConfig');
  btn.disabled=true;
  document.getElementById('configSaveInfo').textContent='保存中…';
  const updates={};
  (configData?.schema||[]).forEach(item=>{
    const el=document.getElementById('cfg_'+item.key);
    if(!el) return;
    let v=el.value.trim();
    if(v==='__custom__'){ const c=document.getElementById('cfg_custom_'+item.key); v=c?c.value.trim():''; }
    updates[item.key]=v;
  });
  try{
    const r=await api('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({updates})});
    document.getElementById('configSaveInfo').textContent=r.message||'已保存';
  }catch(e){ document.getElementById('configSaveInfo').textContent='保存失败：'+e.message; }
  btn.disabled=false;
}
